<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đếm Ngày Yêu ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Dancing+Script:wght@400;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ==========================
     TRANG ĐẾM NGÀY YÊU
=========================== -->

<section id="homePage">

<div class="love-counter-container">

<h1 class="main-title">Chúng Ta Đã Bên Nhau</h1>

<div class="couple-display">

<div class="avatar-container">
<div class="avatar">
<img src="img/avatar_left.jpg" alt="">
</div>
<p class="name">Hoàng Tài</p>
</div>

<div class="heart">❤️</div>

<div class="avatar-container">
<div class="avatar">
<img src="img/avatar_right.jpg" alt="">
</div>
<p class="name">Hồng Nhung</p>
</div>

</div>

<div class="day-counter">
<div class="time-display">
<div class="time-box">

<span id="love-days">0</span>

<p>Ngày</p>

<span id="love-hours" class="time-small">
00:00:00
</span>

</div>
</div>
</div>

<div class="love-message">
<p>
"Yêu Em Yêu Cả Một Đời<br>
Thương Em Thương Cả Một Đời Thanh Xuân"
</p>
</div>

<div class="memories-link">
<a href="#" onclick="showPassword()">
Xem Kho Báu Kỷ Niệm
</a>
</div>

</div>

</section>

<!-- ==========================
     TRANG PASSWORD
=========================== -->

<section id="passwordPage" style="display:none;">

<div class="container">

<div class="title">
NHẬP PASS ĐI NGƯỜI ĐẸP
</div>

<div class="subtitle">
Gợi ý: Sinh nhật của em NHUNG cute 😘<br>
(Ngày / Tháng / Năm)
</div>

<input
type="password"
id="display"
placeholder="Enter password"
readonly>

<div class="keypad">

<button class="btn" onclick="addNum('1')">1</button> <button class="btn" onclick="addNum('2')">2</button> <button class="btn" onclick="addNum('3')">3</button>

<button class="btn" onclick="addNum('4')">4</button> <button class="btn" onclick="addNum('5')">5</button> <button class="btn" onclick="addNum('6')">6</button>

<button class="btn" onclick="addNum('7')">7</button> <button class="btn" onclick="addNum('8')">8</button> <button class="btn" onclick="addNum('9')">9</button>

<button class="btn empty"></button>

<button class="btn" onclick="addNum('0')">
0
</button>

<button class="btn delete" onclick="delNum()">
X
</button>

</div>

<button class="ok" onclick="checkPassword()">
✓
</button>

</div>

<div id="unlock-overlay">
<div class="big-lock">
<div class="front">🔒</div>
<div class="back">🔒</div>
</div>
</div>

</section>

<!-- ==========================
     TRANG ALBUM
=========================== -->

<section id="albumPage" style="display:none;">

<audio id="music" loop src="music.mp3"></audio>

<button class="music-btn" id="musicBtn">
<i class="fa-solid fa-music"></i>
</button>

<button class="back-btn" onclick="backHome()">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="main-content">

<h1>💕 Khoảnh Khắc Tình Yêu 💕</h1>

<div class="message" id="typing"></div>

<button class="action-btn" id="albumBtn">
✨ Mở Kho Báu Kỷ Niệm ✨
</button>

</div>

<div
class="firework-container"
id="fireworkContainer">
</div>

</section>

<script src="script.js"></script>

</body>
</html>
