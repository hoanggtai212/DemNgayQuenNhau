<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhập Mật Khẩu</title>


    
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
    
body{
    background:#ead0d6;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
}

.title{
    color:#ff4f81;
    font-size:22px;
    font-weight:bold;
    margin-bottom:5px;
}

.subtitle{
    color:#ff4f81;
    margin-bottom:25px;
    line-height:1.6;
}

#unlock-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:99999;
    perspective:1500px;
}

.big-lock{
    position:relative;
    width:160px;
    height:160px;
    transform-style:preserve-3d;
}

.big-lock .front,
.big-lock .back{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:150px;
    backface-visibility:hidden;
}

.big-lock .back{
    transform:rotateY(180deg);
}

@keyframes lockSpin{
    from{transform:rotateY(0deg);}
    to{transform:rotateY(1800deg);}
}

.spin{
    animation:lockSpin 2s ease-out forwards;
}

.open{
    animation:popOpen .4s ease forwards;
}

@keyframes popOpen{
    0%{transform:rotateY(1800deg) scale(1);}
    60%{transform:rotateY(1800deg) scale(1.6);}
    100%{transform:rotateY(1800deg) scale(1.3);}
}
    
#lock{
    font-size:80px;
    margin-bottom:15px;
    transition:all .8s ease;
}

.unlock{
    transform:rotateY(180deg) scale(1.2);
}

#display{
    width:280px;
    height:50px;
    border:none;
    border-radius:12px;
    background:#efefef;
    text-align:center;
    font-size:18px;
    margin-bottom:18px;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,80px);
    gap:14px;
    justify-content:center;
}

.btn{
    width:80px;
    height:80px;
    border:none;
    border-radius:15px;
    background:#fff;
    font-size:24px;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(0,0,0,.08);
    transition:all .15s ease;
}

.btn:active{
    transform:translateY(4px) scale(.95);
}

.empty{
    visibility:hidden;
}

.delete{
    background:#ff5b93;
    color:white;
}

.ok{
    width:65px;
    height:65px;
    border:none;
    border-radius:50%;
    background:#ff5b93;
    color:white;
    font-size:28px;
    margin-top:18px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(255,91,147,.4);
    transition:all .15s ease;
}

.ok:active{
    transform:translateY(4px) scale(.95);
}

.shake{
    animation:shake .4s;
}

@keyframes shake{
    0%{transform:translateX(0);}
    25%{transform:translateX(-10px);}
    50%{transform:translateX(10px);}
    75%{transform:translateX(-10px);}
    100%{transform:translateX(0);}
}
</style>
</head>

<body>

<div class="container">

    <div id="lock">🔒</div>

    <div class="title">
        NHẬP PASS ĐI NGƯỜI ĐẸP
    </div>

    <div class="subtitle">
        Gợi ý: Sinh nhật của em NHUNG cute 😘<br>
        (Ngày / Tháng / Năm)
    </div>

    <input
        type="password"
        id="display"
        placeholder="Enter password"
        readonly>

    <div class="keypad">

        <button class="btn" onclick="addNum('1')">1</button>
        <button class="btn" onclick="addNum('2')">2</button>
        <button class="btn" onclick="addNum('3')">3</button>

        <button class="btn" onclick="addNum('4')">4</button>
        <button class="btn" onclick="addNum('5')">5</button>
        <button class="btn" onclick="addNum('6')">6</button>

        <button class="btn" onclick="addNum('7')">7</button>
        <button class="btn" onclick="addNum('8')">8</button>
        <button class="btn" onclick="addNum('9')">9</button>

        <button class="btn empty"></button>
        <button class="btn" onclick="addNum('0')">0</button>
        <button class="btn delete" onclick="delNum()">X</button>

    </div>

    <button class="ok" onclick="checkPassword()">✓</button>

</div>

<script>

let password = "";

function addNum(num){
    password += num;
    document.getElementById("display").value = password;
}

function delNum(){
    password = password.slice(0,-1);
    document.getElementById("display").value = password;
}

function checkPassword(){

if(password === "29012012"){

    const overlay = document.getElementById("unlock-overlay");
    const bigLock = overlay.querySelector(".big-lock");
    const front = bigLock.querySelector(".front");
    const back = bigLock.querySelector(".back");

    overlay.style.display = "flex";

    bigLock.classList.remove("spin","open");

    front.textContent = "🔒";
    back.textContent = "🔒";

    bigLock.classList.add("spin");

    setTimeout(() => {
        bigLock.classList.add("open");
    }, 2000);

    setTimeout(() => {
        front.textContent = "🔓";
        back.textContent = "🔓";
    }, 2400);

    setTimeout(() => {
        window.location.href = "album.html";
    }, 3000);

}else{

    const container = document.querySelector(".container");

    container.classList.add("shake");

    setTimeout(() => {
        container.classList.remove("shake");
    }, 400);

    password = "";
    document.getElementById("display").value = "";
}
}

</script>

<div id="unlock-overlay">
    <div class="big-lock">
        <div class="front">🔒</div>
        <div class="back">🔒</div>
    </div>
</div>
    
</body>
</html>
