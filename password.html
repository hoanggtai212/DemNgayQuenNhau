<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mật Khẩu Tình Yêu</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffd6e7;
    font-family:Poppins,sans-serif;
}

.box{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.1);
}

input{
    width:250px;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:10px 25px;
    border:none;
    border-radius:10px;
    background:#ff4f81;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
    <h2>💖 Nhập Mật Khẩu 💖</h2>

    <input
        type="password"
        id="password"
        placeholder="Nhập mật khẩu">

    <br>

    <button onclick="checkPassword()">
        Xác Nhận
    </button>
</div>

<script>
function checkPassword(){

    const pass =
        document.getElementById("password").value;

    if(pass === "hongnhung"){ // đổi pass ở đây

        window.location.href = "album.html";

    }else{

        alert("Sai mật khẩu rồi 😢");

    }
}
</script>

</body>
</html>
